<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tool scan Acc Liên Quân · minhhoalong</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />

    <!-- Font Awesome 6 (free) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <style>
        /* ── reset & base ── */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #0b0e1a;
            background: radial-gradient(ellipse at 20% 50%, #1a1f35 0%, #0b0e1a 70%);
            position: relative;
            overflow-x: hidden;
        }

        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.4;
            pointer-events: none;
            z-index: 0;
        }
        .orb--1 {
            width: 500px;
            height: 500px;
            top: -150px;
            right: -150px;
            background: #6c3ce0;
        }
        .orb--2 {
            width: 400px;
            height: 400px;
            bottom: -100px;
            left: -100px;
            background: #1e7bff;
        }
        .orb--3 {
            width: 300px;
            height: 300px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #a855f7;
            opacity: 0.15;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 720px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(24px) saturate(1.4);
            -webkit-backdrop-filter: blur(24px) saturate(1.4);
            border-radius: 32px;
            padding: 40px 36px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.06);
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }
        .header__badge {
            display: inline-block;
            background: rgba(168, 85, 247, 0.2);
            border: 1px solid rgba(168, 85, 247, 0.25);
            border-radius: 100px;
            padding: 4px 16px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            color: #c084fc;
            margin-bottom: 12px;
        }
        .header h1 {
            font-size: 28px;
            font-weight: 800;
            color: #fff;
            letter-spacing: -0.5px;
        }
        .header h1 span {
            background: linear-gradient(135deg, #a855f7, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header p {
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            font-weight: 500;
            margin-top: 4px;
            letter-spacing: 0.2px;
        }
        .header p i {
            margin-right: 6px;
            color: #a855f7;
        }

        .form-row {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .form-group {
            flex: 1;
            min-width: 120px;
        }
        .form-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 8px;
            letter-spacing: 0.2px;
        }
        .form-group label i {
            color: #a855f7;
            font-size: 15px;
        }
        .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            transition: border 0.25s ease, box-shadow 0.25s ease;
        }
        .input-wrap:focus-within {
            border-color: #a855f7;
            box-shadow: 0 0 0 4px rgba(168, 85, 247, 0.15);
        }
        .input-wrap .input-icon {
            padding: 0 0 0 18px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 16px;
        }
        .input-wrap input[type="number"] {
            width: 100%;
            padding: 14px 18px;
            background: transparent;
            border: none;
            outline: none;
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            font-family: 'Inter', sans-serif;
            -moz-appearance: textfield;
        }
        .input-wrap input[type="number"]::-webkit-outer-spin-button,
        .input-wrap input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .input-wrap input::placeholder {
            color: rgba(255, 255, 255, 0.2);
            font-weight: 400;
            font-size: 16px;
        }

        .btn {
            width: 100%;
            padding: 18px 24px;
            border: none;
            border-radius: 16px;
            font-size: 17px;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            color: #fff;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: linear-gradient(135deg, #7c3aed, #4f46e5);
            box-shadow: 0 8px 30px rgba(124, 58, 237, 0.35);
            position: relative;
            overflow: hidden;
        }
        .btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #6d28d9, #4338ca);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .btn:hover:not(:disabled)::after {
            opacity: 1;
        }
        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(124, 58, 237, 0.45);
        }
        .btn:active:not(:disabled) {
            transform: scale(0.98);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .btn span,
        .btn i {
            position: relative;
            z-index: 1;
        }
        .btn i {
            font-size: 18px;
        }
        .btn .spinner {
            display: none;
            width: 22px;
            height: 22px;
            border: 2.5px solid rgba(255, 255, 255, 0.2);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            position: relative;
            z-index: 1;
        }
        .btn.loading .spinner {
            display: block;
        }
        .btn.loading .btn-text {
            display: none;
        }
        .btn.loading .btn-icon {
            display: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .status-area {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .status-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 100px;
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .status-bar.active {
            opacity: 1;
        }
        .status-bar .fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #a855f7, #3b82f6);
            border-radius: 100px;
            transition: width 0.3s ease;
        }

        .status-message {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.6);
            min-height: 28px;
            transition: color 0.3s ease;
        }
        .status-message i {
            font-size: 16px;
            width: 20px;
            text-align: center;
            color: #a855f7;
        }
        .status-message.success {
            color: #34d399;
        }
        .status-message.success i {
            color: #34d399;
        }
        .status-message.error {
            color: #f87171;
        }
        .status-message.error i {
            color: #f87171;
        }
        .status-message .highlight {
            color: #fff;
            font-weight: 700;
        }

        .log-area {
            margin-top: 16px;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 12px 16px;
            max-height: 200px;
            overflow-y: auto;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 13px;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.7);
        }
        .log-area::-webkit-scrollbar {
            width: 5px;
        }
        .log-area::-webkit-scrollbar-track {
            background: transparent;
        }
        .log-area::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 100px;
        }
        .log-entry {
            padding: 2px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            white-space: pre-wrap;
            word-break: break-all;
        }
        .log-entry:last-child {
            border-bottom: none;
        }
        .log-entry .success {
            color: #34d399;
        }
        .log-entry .error {
            color: #f87171;
        }
        .log-entry .info {
            color: #60a5fa;
        }
        .log-entry .highlight {
            color: #fbbf24;
        }

        .result-area {
            margin-top: 24px;
        }
        .result-area .result-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .result-area .result-header label {
            font-size: 14px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.7);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .result-area .result-header label i {
            color: #a855f7;
        }
        .result-actions {
            display: flex;
            gap: 8px;
        }
        .result-actions button {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            padding: 6px 12px;
            font-size: 13px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .result-actions button:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.15);
        }
        .result-actions button i {
            font-size: 13px;
        }

        .result-textarea-wrap {
            position: relative;
            border-radius: 16px;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.06);
            overflow: hidden;
            transition: border 0.25s ease;
        }
        .result-textarea-wrap:focus-within {
            border-color: rgba(168, 85, 247, 0.3);
        }
        .result-textarea-wrap textarea {
            width: 100%;
            height: 200px;
            padding: 18px 20px;
            background: transparent;
            border: none;
            outline: none;
            resize: vertical;
            font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
            font-size: 14px;
            line-height: 1.7;
            color: #e2e8f0;
            tab-size: 2;
        }
        .result-textarea-wrap textarea::placeholder {
            color: rgba(255, 255, 255, 0.15);
            font-family: 'Inter', sans-serif;
            font-weight: 400;
            font-size: 15px;
        }

        .result-count {
            display: inline-block;
            margin-top: 10px;
            font-size: 13px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.3);
            padding: 4px 14px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 100px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .result-count strong {
            color: rgba(255, 255, 255, 0.7);
            font-weight: 700;
        }

        .download-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            padding: 6px 16px;
            font-size: 13px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .download-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.15);
        }
        .download-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            pointer-events: none;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 12px 28px;
            border-radius: 100px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            z-index: 999;
            pointer-events: none;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast i {
            font-size: 18px;
        }
        .toast.success i {
            color: #34d399;
        }
        .toast.error i {
            color: #f87171;
        }
        .toast.info i {
            color: #60a5fa;
        }

        @media (max-width: 640px) {
            .container {
                padding: 28px 20px;
                border-radius: 24px;
            }
            .header h1 {
                font-size: 22px;
            }
            .form-row {
                flex-direction: column;
                gap: 12px;
            }
            .input-wrap input[type="number"] {
                font-size: 16px;
                padding: 14px 16px;
            }
            .btn {
                font-size: 15px;
                padding: 16px 20px;
            }
            .result-textarea-wrap textarea {
                height: 150px;
                font-size: 13px;
                padding: 14px 16px;
            }
            .result-area .result-header {
                flex-wrap: wrap;
                gap: 8px;
            }
            .result-actions button {
                padding: 5px 10px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

    <div class="orb orb--1"></div>
    <div class="orb orb--2"></div>
    <div class="orb orb--3"></div>

    <div class="container">

        <div class="header">
            <div class="header__badge">
                <i class="fas fa-shield-halved" style="margin-right:6px;"></i> Tool v3.0
            </div>
            <h1>Quét <span>Acc Liên Quân</span></h1>
            <p><i class="fas fa-code"></i> by minhhoalong &bull; lấy acc từ API keyherlyswar</p>
        </div>

        <!-- Form row: quantity + threads -->
        <div class="form-row">
            <div class="form-group">
                <label for="quantity">
                    <i class="fas fa-hashtag"></i> Số lượng
                </label>
                <div class="input-wrap">
                    <span class="input-icon"><i class="fas fa-user"></i></span>
                    <input type="number" id="quantity" min="1" value="5" placeholder="VD: 5" />
                </div>
            </div>
            <div class="form-group">
                <label for="threads">
                    <i class="fas fa-bolt"></i> Số luồng
                </label>
                <div class="input-wrap">
                    <span class="input-icon"><i class="fas fa-layer-group"></i></span>
                    <input type="number" id="threads" min="1" value="3" placeholder="VD: 3" />
                </div>
            </div>
        </div>

        <!-- Start button -->
        <button class="btn" id="startButton">
            <span class="btn-icon"><i class="fas fa-rocket"></i></span>
            <span class="btn-text">Bắt đầu lấy acc</span>
            <span class="spinner"></span>
        </button>

        <!-- Status -->
        <div class="status-area">
            <div class="status-bar" id="progressBar">
                <div class="fill" id="progressFill"></div>
            </div>
            <div class="status-message" id="statusMessage">
                <i class="fas fa-circle-info"></i>
                <span>Sẵn sàng — nhập số lượng và số luồng</span>
            </div>
        </div>

        <!-- Log area -->
        <div class="log-area" id="logArea">
            <div class="log-entry info">📌 Sẵn sàng. Nhấn "Bắt đầu" để chạy.</div>
        </div>

        <!-- Result -->
        <div class="result-area">
            <div class="result-header">
                <label for="result">
                    <i class="fas fa-list-ul"></i> Kết quả
                </label>
                <div class="result-actions">
                    <button id="copyBtn" title="Sao chép">
                        <i class="fas fa-copy"></i> Sao chép
                    </button>
                    <button id="clearBtn" title="Xóa">
                        <i class="fas fa-eraser"></i> Xóa
                    </button>
                    <button class="download-btn" id="downloadBtn" disabled>
                        <i class="fas fa-download"></i> Tải acc.txt
                    </button>
                </div>
            </div>
            <div class="result-textarea-wrap">
                <textarea id="result" readonly placeholder="Kết quả sẽ hiển thị ở đây..."></textarea>
            </div>
            <div class="result-count" id="resultCount">
                <i class="fas fa-database" style="margin-right:6px;opacity:0.4;"></i>
                <strong id="countNumber">0</strong> tài khoản
            </div>
        </div>

    </div>

    <!-- Toast -->
    <div class="toast" id="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toastMessage">Đã sao chép!</span>
    </div>

    <script>
        // ─── DOM refs ──────────────────────────────────────────────
        const quantityInput = document.getElementById('quantity');
        const threadsInput = document.getElementById('threads');
        const startBtn = document.getElementById('startButton');
        const statusMsg = document.getElementById('statusMessage');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const logArea = document.getElementById('logArea');
        const resultTextarea = document.getElementById('result');
        const countNumber = document.getElementById('countNumber');
        const copyBtn = document.getElementById('copyBtn');
        const clearBtn = document.getElementById('clearBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMessage');

        // ─── API ──────────────────────────────────────────────────
        const API_URL = 'https://keyherlyswar.x10.mx/Apidocs/reg/reglq.php';
        // Sử dụng proxy để tránh CORS
        const CORS_PROXY = 'https://api.allorigins.win/raw?url=';

        // ─── State ────────────────────────────────────────────────
        let isRunning = false;
        let successfulAccounts = []; // lưu {account, password}

        // ─── Helpers ──────────────────────────────────────────────
        function setStatus(text, type = 'info') {
            const iconMap = {
                info: 'fa-circle-info',
                success: 'fa-check-circle',
                error: 'fa-circle-exclamation',
                loading: 'fa-spinner fa-spin'
            };
            const icon = iconMap[type] || iconMap.info;
            statusMsg.className = 'status-message' + (type === 'success' ? ' success' : '') + (type === 'error' ?
                ' error' : '');
            statusMsg.innerHTML = `<i class="fas ${icon}"></i><span>${text}</span>`;
        }

        function setProgress(pct) {
            if (pct >= 0 && pct <= 100) {
                progressBar.classList.add('active');
                progressFill.style.width = pct + '%';
            } else {
                progressBar.classList.remove('active');
                progressFill.style.width = '0%';
            }
        }

        function addLog(message, type = 'info') {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = message;
            logArea.appendChild(entry);
            logArea.scrollTop = logArea.scrollHeight;
        }

        function clearLog() {
            logArea.innerHTML = '';
            addLog('🔄 Đang khởi tạo...', 'info');
        }

        function updateResult(accounts) {
            const lines = accounts.map((a, i) => `[${i+1}] Tk: ${a.account}\n     Mk: ${a.password}`);
            resultTextarea.value = lines.join('\n');
            countNumber.textContent = accounts.length;
        }

        function showToast(message, type = 'success') {
            toastMsg.textContent = message;
            toast.className = 'toast ' + type;
            void toast.offsetWidth;
            toast.classList.add('show');
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => {
                toast.classList.remove('show');
            }, 2800);
        }

        // ─── Gọi API (có fallback) ──────────────────────────────
        async function fetchOneAccount(jobId) {
            // Thử trực tiếp (có thể bị CORS)
            try {
                const resp = await fetch(API_URL, { signal: AbortSignal.timeout(5000) });
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const data = await resp.json();
                if (data.status && data.result && data.result.length > 0) {
                    const acc = data.result[0];
                    if (acc.account && acc.password) {
                        return { success: true, account: acc.account, password: acc.password };
                    } else {
                        return { success: false, error: 'Thiếu field account/password' };
                    }
                }
                return { success: false, error: 'Cấu trúc API không hợp lệ' };
            } catch (e) {
                // Nếu lỗi CORS hoặc timeout, thử qua proxy
                try {
                    const proxyUrl = CORS_PROXY + encodeURIComponent(API_URL);
                    const resp2 = await fetch(proxyUrl, { signal: AbortSignal.timeout(10000) });
                    if (!resp2.ok) throw new Error(`Proxy HTTP ${resp2.status}`);
                    const data2 = await resp2.json();
                    if (data2.status && data2.result && data2.result.length > 0) {
                        const acc = data2.result[0];
                        if (acc.account && acc.password) {
                            return { success: true, account: acc.account, password: acc.password };
                        } else {
                            return { success: false, error: 'Thiếu field (proxy)' };
                        }
                    }
                    return { success: false, error: 'Cấu trúc không hợp lệ (proxy)' };
                } catch (e2) {
                    return { success: false, error: e2.message };
                }
            }
        }

        // ─── Hàm chạy đa luồng ──────────────────────────────────
        async function asyncPool(limit, array, iteratorFn) {
            const ret = [];
            const executing = [];
            for (const item of array) {
                const p = Promise.resolve().then(() => iteratorFn(item));
                ret.push(p);
                const e = p.then(() => executing.splice(executing.indexOf(e), 1));
                executing.push(e);
                if (executing.length >= limit) {
                    await Promise.race(executing);
                }
            }
            return Promise.all(ret);
        }

        // ─── Action chính ──────────────────────────────────────────
        async function startGetAcc() {
            if (isRunning) return;

            const total = parseInt(quantityInput.value);
            let concurrency = parseInt(threadsInput.value);
            if (isNaN(total) || total < 1) {
                showToast('Số lượng phải lớn hơn 0', 'error');
                return;
            }
            if (isNaN(concurrency) || concurrency < 1) concurrency = 1;
            concurrency = Math.min(concurrency, total);

            isRunning = true;
            startBtn.disabled = true;
            startBtn.classList.add('loading');
            setStatus('⏳ Đang khởi tạo...', 'loading');
            setProgress(0);
            clearLog();
            successfulAccounts = [];
            updateResult([]);
            downloadBtn.disabled = true;
            downloadBtn.textContent = '📥 Tải acc.txt';

            addLog(`⚡ Bắt đầu: ${total} acc, ${concurrency} luồng đồng thời`, 'info');

            const jobs = Array.from({ length: total }, (_, i) => i + 1);
            let completed = 0;
            let successCount = 0;
            let failCount = 0;

            const startTime = performance.now();

            try {
                await asyncPool(concurrency, jobs, async (jobId) => {
                    const result = await fetchOneAccount(jobId);
                    completed++;
                    if (result.success) {
                        successCount++;
                        successfulAccounts.push({ account: result.account, password: result.password });
                        addLog(`✅ [${successCount+failCount}/${total}] Thành công (Job #${jobId}): ${result.account}`, 'success');
                        addLog(`   Mk: ${result.password}`, 'success');
                    } else {
                        failCount++;
                        addLog(`❌ [${successCount+failCount}/${total}] Job #${jobId} thất bại: ${result.error}`, 'error');
                    }
                    const pct = Math.min(100, Math.round((completed / total) * 100));
                    setProgress(pct);
                    setStatus(`⏳ Đang xử lý... ${completed}/${total} (${successCount} thành công)`, 'loading');
                });
            } catch (err) {
                addLog(`⚠️ Lỗi hệ thống: ${err.message}`, 'error');
            }

            const endTime = performance.now();
            const elapsed = ((endTime - startTime) / 1000).toFixed(2);

            addLog(`\n🏁 Hoàn thành! Thành công: ${successCount}, Thất bại: ${failCount} (${elapsed}s)`, 'info');

            // Cập nhật kết quả
            updateResult(successfulAccounts);

            if (successfulAccounts.length > 0) {
                setStatus(`✅ Hoàn thành! Lấy được <span class="highlight">${successfulAccounts.length}</span> tài khoản`, 'success');
                downloadBtn.disabled = false;
                downloadBtn.textContent = `📥 Tải acc.txt (${successfulAccounts.length})`;
                showToast(`Lấy thành công ${successfulAccounts.length} tài khoản!`, 'success');
            } else {
                setStatus('❌ Không lấy được acc nào. Kiểm tra API hoặc kết nối.', 'error');
                showToast('Không lấy được acc nào!', 'error');
            }

            setProgress(100);
            isRunning = false;
            startBtn.disabled = false;
            startBtn.classList.remove('loading');
        }

        // ─── Tải file acc.txt ──────────────────────────────────────
        function downloadAccFile() {
            if (successfulAccounts.length === 0) {
                showToast('Không có tài khoản để tải', 'error');
                return;
            }
            let content = '';
            successfulAccounts.forEach((acc, idx) => {
                content += `[${idx+1}] Tk: ${acc.account}\n`;
                content += `     Mk: ${acc.password}\n`;
            });
            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'acc.txt';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(link.href);
            showToast(`Đã tải ${successfulAccounts.length} tài khoản`, 'success');
        }

        // ─── Copy ──────────────────────────────────────────────────
        async function copyResult() {
            const text = resultTextarea.value;
            if (!text.trim()) {
                showToast('Không có dữ liệu để sao chép', 'error');
                return;
            }
            try {
                await navigator.clipboard.writeText(text);
                showToast('Đã sao chép!', 'success');
            } catch (_) {
                resultTextarea.select();
                document.execCommand('copy');
                showToast('Đã sao chép!', 'success');
            }
        }

        // ─── Clear ──────────────────────────────────────────────────
        function clearResult() {
            resultTextarea.value = '';
            countNumber.textContent = '0';
            successfulAccounts = [];
            downloadBtn.disabled = true;
            downloadBtn.textContent = '📥 Tải acc.txt';
            setStatus('🧹 Đã xóa kết quả', 'info');
            setProgress(0);
            showToast('Đã xóa', 'info');
            clearLog();
            addLog('📌 Sẵn sàng.', 'info');
        }

        // ─── Event bindings ────────────────────────────────────────
        startBtn.addEventListener('click', startGetAcc);
        copyBtn.addEventListener('click', copyResult);
        clearBtn.addEventListener('click', clearResult);
        downloadBtn.addEventListener('click', downloadAccFile);

        // Enter key triggers start
        [quantityInput, threadsInput].forEach(input => {
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    startBtn.click();
                }
            });
        });

        // ─── Init ──────────────────────────────────────────────────
        setStatus('Sẵn sàng — nhập số lượng và số luồng', 'info');
        setProgress(0);
        updateResult([]);
        downloadBtn.disabled = true;

        console.log('🚀 Tool scan Acc Liên Quân · by minhhoalong (bản nâng cấp)');
    </script>
</body>
</html>
